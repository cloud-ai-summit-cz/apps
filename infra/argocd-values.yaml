# ArgoCD Helm Chart Values
# Configured for AKS Automatic with Deployment Safeguards

# Dex Server - handles authentication  
dex:
  enabled: true
  # Set resources for the copyutil init container
  initImage:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  # Main container resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Redis - used for caching
redis:
  enabled: true
  # Main container resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Repo Server - responsible for cloning Git repos
repoServer:
  # Set resources for the copyutil init container
  copyutil:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  # Main container resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Application Controller - manages application state
controller:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Server - API server and UI
server:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Disable external access by default (use port-forward or configure ingress separately)
  service:
    type: ClusterIP

# ApplicationSet Controller - manages ApplicationSets
applicationSet:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Notifications Controller - handles notifications
notifications:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Configs
configs:
  # Create RBAC policies
  rbac:
    create: true
