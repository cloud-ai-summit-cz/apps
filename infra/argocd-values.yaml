# ArgoCD Helm Chart Values
# Configured for AKS Automatic with Deployment Safeguards

# Global settings
global:
  # Add resource limits to all init containers to satisfy AKS policies
  initContainers:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# Dex Server - handles authentication
dex:
  enabled: true
  initContainers:
    - name: copyutil
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

# Redis - used for caching
redis:
  enabled: true
  initContainers:
    - name: secret-init
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

# Repo Server - responsible for cloning Git repos
repoServer:
  initContainers:
    - name: copyutil
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  # Main container resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Application Controller - manages application state
controller:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Server - API server and UI
server:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Disable external access by default (use port-forward or configure ingress separately)
  service:
    type: ClusterIP

# ApplicationSet Controller - manages ApplicationSets
applicationSet:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Notifications Controller - handles notifications
notifications:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Configs
configs:
  # Create RBAC policies
  rbac:
    create: true
