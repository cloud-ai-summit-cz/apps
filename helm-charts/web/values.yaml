# Default values for web service
# This file provides sensible defaults that can be overridden by environment-specific values

replicaCount: 1

image:
  repository: "" # Override with ACR login server + image name
  pullPolicy: IfNotPresent
  tag: "latest" # Override with commit SHA in env-specific values

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

httpRoute:
  enabled: true
  parentRefs: []
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: PathPrefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5

# Environment variables (override in env-specific values)
# Web service is static files served by nginx, but uses docker-entrypoint.sh to generate env-config.js at runtime
env:
  TOY_SERVICE_URL: "http://localhost:8001"
  TRIP_SERVICE_URL: "http://localhost:8002"
  MSAL_REDIRECT_URI: "http://localhost:3000"

ingress:
  publicIpFqdn: ""

nodeSelector: {}

tolerations: []

affinity: {}
