# Default values for toy service
# This file provides sensible defaults that can be overridden by environment-specific values

replicaCount: 1

image:
  repository: "" # Override with ACR login server + image name
  pullPolicy: IfNotPresent
  tag: "latest" # Override with commit SHA in env-specific values

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

workloadIdentity:
  enabled: false
  clientId: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8001

httpRoute:
  enabled: false
  parentRefs: []
  hosts:
    - host: ""
      paths:
        - path: /api/toys
          pathType: PathPrefix
          # rewrite:
          #   path:
          #     type: ReplacePrefixMatch
          #     replacePrefixMatch: /

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8001
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8001
  initialDelaySeconds: 10
  periodSeconds: 5

# Environment variables (override in env-specific values)
env:
  AZURE_TENANT_ID: "{{ .Values.auth.tenantId }}"
  APP_ID_URI: "{{ .Values.auth.appIdUri }}"
  COSMOS_ENDPOINT: "{{ .Values.cosmos.endpoint }}"
  COSMOS_DATABASE_NAME: "{{ .Values.cosmos.databaseName }}"
  COSMOS_CONTAINER_NAME: "toys"
  STORAGE_ACCOUNT_URL: "{{ .Values.storage.accountUrl }}"
  BLOB_CONTAINER_AVATARS: "avatars"
  API_HOST: "0.0.0.0"
  API_PORT: "8001"
  LOG_LEVEL: "INFO"
  AZURE_CLIENT_ID: "{{ .Values.workloadIdentities.toy.clientId }}"
  AZURE_TOKEN_CREDENTIALS: "WorkloadIdentityCredential"

nodeSelector: {}

tolerations: []

affinity: {}
