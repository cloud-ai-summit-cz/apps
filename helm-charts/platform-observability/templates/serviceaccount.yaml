{{- if .Values.otelCollector.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.otelCollector.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.otelCollector.azureMonitor.clientId }}
    azure.workload.identity/client-id: {{ .Values.otelCollector.azureMonitor.clientId | quote }}
    {{- end }}
    {{- with .Values.otelCollector.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
