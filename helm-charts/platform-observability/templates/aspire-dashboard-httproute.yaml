{{- if and .Values.aspireDashboard.enabled .Values.aspireDashboard.httpRoute.enabled .Values.aspireDashboard.httpRoute.parentRefs .Values.aspireDashboard.httpRoute.hosts }}
{{- $hostname := .Values.ingress.publicIpFqdn | default "" }}
{{- range $index, $host := .Values.aspireDashboard.httpRoute.hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "aspire-dashboard-%d" (add $index 1) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: aspire-dashboard
    app.kubernetes.io/component: dashboard
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    {{- range $.Values.aspireDashboard.httpRoute.parentRefs }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if $hostname }}
  hostnames:
    - {{ $hostname | quote }}
  {{- end }}
  rules:
    {{- range $host.paths }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | default "/" | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: aspire-dashboard
          port: {{ $.Values.aspireDashboard.service.uiPort }}
          weight: 1
      {{- if .rewrite }}
      filters:
        - type: URLRewrite
          urlRewrite:
            {{- if .rewrite.hostname }}
            hostname: {{ .rewrite.hostname | quote }}
            {{- end }}
            {{- if .rewrite.path }}
            path:
              type: {{ .rewrite.path.type | default "ReplacePrefixMatch" | quote }}
              {{- if .rewrite.path.replacePrefixMatch }}
              replacePrefixMatch: {{ .rewrite.path.replacePrefixMatch | quote }}
              {{- end }}
              {{- if .rewrite.path.replaceFullPath }}
              replaceFullPath: {{ .rewrite.path.replaceFullPath | quote }}
              {{- end }}
            {{- end }}
      {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
