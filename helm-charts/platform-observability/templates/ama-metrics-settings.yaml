{{- if .Values.istio.metrics.enabled }}
# Azure Monitor Agent (ama-metrics) settings ConfigMap
# Enables pod annotation-based scraping for Istio metrics
# Reference: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/prometheus-istio-integration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ama-metrics-settings
    app.kubernetes.io/component: prometheus-scraping
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  schema-version: v1
  config-version: ver1
  
  # Enable/disable default scrape targets
  default-scrape-settings-enabled: |-
    kubelet = true
    coredns = true
    cadvisor = true
    kubeproxy = false
    apiserver = false
    kubestate = true
    nodeexporter = true
    windowsexporter = false
    windowskubeproxy = false
    kappiebasic = true
    prometheuscollectorhealth = false
  
  # Enable pod annotation-based scraping for Istio namespaces
  # Istio proxies expose metrics via prometheus.io/* annotations
  # Namespaces: aks-istio-system (control plane), aks-istio-ingress (gateway), app namespace
  pod-annotation-based-scraping: |-
    podannotationnamespaceregex = "{{ .Values.istio.metrics.scrapeNamespaces | join "|" }}"
  
  # Scrape intervals for default targets
  default-targets-scrape-interval-settings: |-
    kubelet = "{{ .Values.istio.metrics.scrapeInterval }}"
    coredns = "{{ .Values.istio.metrics.scrapeInterval }}"
    cadvisor = "{{ .Values.istio.metrics.scrapeInterval }}"
    kubeproxy = "{{ .Values.istio.metrics.scrapeInterval }}"
    apiserver = "{{ .Values.istio.metrics.scrapeInterval }}"
    kubestate = "{{ .Values.istio.metrics.scrapeInterval }}"
    nodeexporter = "{{ .Values.istio.metrics.scrapeInterval }}"
    windowsexporter = "{{ .Values.istio.metrics.scrapeInterval }}"
    windowskubeproxy = "{{ .Values.istio.metrics.scrapeInterval }}"
    kappiebasic = "{{ .Values.istio.metrics.scrapeInterval }}"
    prometheuscollectorhealth = "{{ .Values.istio.metrics.scrapeInterval }}"
    podannotations = "{{ .Values.istio.metrics.scrapeInterval }}"
{{- end }}
