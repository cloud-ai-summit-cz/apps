# OpenTelemetry Collector configuration
otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    # Version 0.140.1+ includes azureauthextension for AAD authentication
    tag: "0.140.1"
    pullPolicy: IfNotPresent
  
  replicas: 1
  
  # Service Account configuration for Workload Identity
  serviceAccount:
    create: true
    name: "otel-collector"
    annotations: {}
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  service:
    type: ClusterIP
    # OTLP gRPC receiver
    grpcPort: 4317
    # OTLP HTTP receiver
    httpPort: 4318
  
  # Azure Monitor configuration
  azureMonitor:
    enabled: true
    connectionString: ""
  
  # Prometheus Remote Write configuration for Azure Monitor Workspace
  prometheus:
    enabled: true
    # Constructed as: <DCE_ENDPOINT>/dataCollectionRules/<DCR_ID>/streams/Microsoft-PrometheusMetrics/api/v1/write?api-version=2023-04-24
    remoteWriteEndpoint: ""

  # ConfigMap will be created with OTEL collector config
  # Uses azureauthextension for AAD authentication when DisableLocalAuth=true
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      
      # Azure AD authentication extension using workload identity
      # This acquires AAD tokens for Azure Monitor ingestion
      azureauth:
        # Required: specify the scope for Azure Monitor
        scopes:
          - https://monitor.azure.com/.default
        workload_identity:
          client_id: "${env:AZURE_CLIENT_ID}"
          tenant_id: "${env:AZURE_TENANT_ID}"
          # Token file is auto-injected by AKS workload identity webhook
          federated_token_file: "/var/run/secrets/azure/tokens/azure-identity-token"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
      
      # Filter out noisy/internal traces
      filter/drop-otel-traces:
        error_mode: ignore
        traces:
          span:
            # Drop Istio gateway spans for OTEL collector paths (tracing the traces)
            - 'attributes["http.url"] != nil and IsMatch(attributes["http.url"], ".*/otel/.*")'
            - 'attributes["url.path"] != nil and IsMatch(attributes["url.path"], ".*/otel/.*")'
      
      # Enrich Azure Cosmos DB spans with database semantic conventions
      # Transforms HTTP-level spans from azure-core Python SDK into proper database spans
      # This enables Application Insights to recognize Cosmos DB as a database dependency
      # Reference: https://opentelemetry.io/docs/specs/semconv/database/cosmosdb/
      # Note: We set both db.system (old) and db.system.name (new) for compatibility
      transform/cosmosdb-enrichment:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # Identify Cosmos DB spans by URL pattern and set db.system attributes
              # db.system.name is the new semantic convention used by OTEL Collector azuremonitor exporter
              # db.system is the old convention for backward compatibility
              - set(attributes["db.system.name"], "cosmosdb") where attributes["http.url"] != nil and IsMatch(attributes["http.url"], ".*\\.documents\\.azure\\.com.*")
              - set(attributes["db.system"], "cosmosdb") where attributes["http.url"] != nil and IsMatch(attributes["http.url"], ".*\\.documents\\.azure\\.com.*")
              
              # Derive operation names from HTTP method and resource type
              # Document operations (most common) - URL ends with /docs or /docs/
              - set(attributes["db.operation.name"], "create_item") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "POST" and IsMatch(attributes["http.url"], ".*/docs/?$$")
              - set(attributes["db.operation.name"], "read_item") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "GET" and IsMatch(attributes["http.url"], ".*/docs/[^/]+$$")
              - set(attributes["db.operation.name"], "replace_item") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "PUT" and IsMatch(attributes["http.url"], ".*/docs/.*")
              - set(attributes["db.operation.name"], "delete_item") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "DELETE" and IsMatch(attributes["http.url"], ".*/docs/.*")
              - set(attributes["db.operation.name"], "patch_item") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "PATCH" and IsMatch(attributes["http.url"], ".*/docs/.*")
              - set(attributes["db.operation.name"], "query_items") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "POST" and IsMatch(attributes["http.url"], ".*/docs/?$$") and attributes["http.request.header.x-ms-documentdb-isquery"] != nil
              
              # Container operations
              - set(attributes["db.operation.name"], "query_containers") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "GET" and IsMatch(attributes["http.url"], ".*/colls/?$$")
              - set(attributes["db.operation.name"], "create_container") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "POST" and IsMatch(attributes["http.url"], ".*/colls/?$$")
              - set(attributes["db.operation.name"], "read_container") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "GET" and IsMatch(attributes["http.url"], ".*/colls/[^/]+/?$$")
              - set(attributes["db.operation.name"], "delete_container") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "DELETE" and IsMatch(attributes["http.url"], ".*/colls/[^/]+/?$$")
              
              # Database operations
              - set(attributes["db.operation.name"], "query_databases") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "GET" and IsMatch(attributes["http.url"], ".*/dbs/?$$")
              - set(attributes["db.operation.name"], "create_database") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "POST" and IsMatch(attributes["http.url"], ".*/dbs/?$$")
              - set(attributes["db.operation.name"], "read_database") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "GET" and IsMatch(attributes["http.url"], ".*/dbs/[^/]+/?$$")
              - set(attributes["db.operation.name"], "delete_database") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "DELETE" and IsMatch(attributes["http.url"], ".*/dbs/[^/]+/?$$")
              
              # Stored procedure operations
              - set(attributes["db.operation.name"], "execute_stored_procedure") where attributes["db.system"] == "cosmosdb" and attributes["http.method"] == "POST" and IsMatch(attributes["http.url"], ".*/sprocs/.*")
    
    exporters:
      # Export to Aspire Dashboard via OTLP
      otlp:
        endpoint: aspire-dashboard:18889
        tls:
          insecure: true
      
      # Azure Monitor exporter with AAD authentication
      # Uses azureauthextension to add Bearer token to requests
      azuremonitor:
        connection_string: "${env:APPLICATIONINSIGHTS_CONNECTION_STRING}"
        auth:
          authenticator: azureauth
      
      # Debug exporter for troubleshooting (logs to collector stdout)
      debug:
        verbosity: basic
      
      # Prometheus Remote Write to Azure Monitor Workspace
      # Uses azureauthextension for AAD authentication (same as azuremonitor exporter)
      prometheusremotewrite/azuremonitor:
        endpoint: "${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}"
        auth:
          authenticator: azureauth
        resource_to_telemetry_conversion:
          enabled: true
        add_metric_suffixes: true
    
    service:
      telemetry:
        logs:
          level: info
      extensions: [health_check, azureauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/cosmosdb-enrichment, filter/drop-otel-traces, batch]
          exporters: [otlp, debug, azuremonitor]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp, debug, azuremonitor, prometheusremotewrite/azuremonitor]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp, debug, azuremonitor]

# Aspire Dashboard configuration
aspireDashboard:
  enabled: true
  # Path base for serving under a subpath (e.g., /aspire)
  # Set this when exposing via HTTPRoute with a path prefix
  pathBase: ""
  image:
    repository: mcr.microsoft.com/dotnet/aspire-dashboard
    tag: "9.0"
    pullPolicy: IfNotPresent
  
  replicas: 1
  
  resources:
    requests:
      cpu: 50m
      memory: 196Mi
    limits:
      cpu: 200m
      memory: 512Mi
  
  service:
    type: ClusterIP
    # Dashboard UI port
    uiPort: 18888
    # OTLP gRPC receiver port
    otlpPort: 18889
  
  # HTTPRoute configuration for Gateway API
  httpRoute:
    enabled: false
    parentRefs: []
    hosts:
      - host: ""
        paths:
          - path: /aspire
            pathType: PathPrefix
            rewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: /
  
  # Dashboard frontend authentication
  # Options: Unsecured, BrowserToken
  # BrowserToken generates a login token displayed in logs
  frontend:
    authMode: Unsecured
    # Set to BrowserToken for production and retrieve token from pod logs
  
  # OTLP endpoint configuration
  otlp:
    # Allowed CORS origins for browser-based OTLP (if needed)
    corsAllowedOrigins: "*"
    # Primary endpoint for receiving telemetry
    primaryEndpoint: http://0.0.0.0:18889

# Istio observability configuration
# Enables tracing via OpenTelemetry and metrics via ama-metrics Prometheus scraping
istio:
  enabled: true
  # Istio addon revision (check with: kubectl get configmap -n aks-istio-system)
  revision: "asm-1-26"
  
  # Tracing configuration
  tracing:
    enabled: true
    # 100% sampling - all requests traced
    samplingPercentage: 100
    # OTEL collector service name (in same namespace)
    collectorService: otel-collector
    # OTEL gRPC port
    collectorPort: 4317
    # Resource detectors for enriching trace data
    resourceDetectors:
      environment: {}
    # Custom tags added to all trace spans
    customTags:
      environment: "staging"
  
  # Metrics configuration for ama-metrics (Azure Monitor Prometheus)
  metrics:
    enabled: true
    # Namespaces to scrape via pod annotations
    # - aks-istio-system: Istio control plane (istiod)
    # - aks-istio-ingress: Managed Istio ingress gateway
    # - toytrip-staging: Application namespace
    scrapeNamespaces:
      - aks-istio-system
      - aks-istio-ingress
      - toytrip-staging
    # Scrape interval for metrics collection
    scrapeInterval: "30s"

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: platform-observability
