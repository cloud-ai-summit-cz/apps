# Default values for platform-cert-manager

# Environment: staging or production
# This determines which Let's Encrypt server to use
environment: staging

# Let's Encrypt configuration
letsencrypt:
  email: "your-email@example.com" 
  
  # ACME server URLs
  staging: "https://acme-staging-v02.api.letsencrypt.org/directory"
  production: "https://acme-v02.api.letsencrypt.org/directory"
  
  # Default ingress class used when the ingress solver is selected
  ingressClassName: "nginx"
  solver:
    # Supported values: ingress, gateway
    type: ingress
    ingress:
      ingressClassName: ""
      serviceType: ""
    gateway:
      parentRefs: []
      labels: {}

# cert-manager Helm chart values
cert-manager:
  crds:
    enabled: true
  extraArgs:
    - --enable-gateway-api
