# Default values for platform-cert-manager

# Let's Encrypt configuration (production-only certificates)
letsencrypt:
  email: "your-email@example.com"
  server: "https://acme-v02.api.letsencrypt.org/directory"
  clusterIssuerName: "letsencrypt"
  privateKeySecretName: "letsencrypt"
  # Default ingress class used when the ingress solver is selected
  ingressClassName: "nginx"
  solver:
    # Supported values: ingress, gateway
    type: ingress
    ingress:
      ingressClassName: ""
      serviceType: ""
    gateway:
      parentRefs: []
      labels: {}

# cert-manager Helm chart values
cert-manager:
  crds:
    enabled: true
  extraArgs:
    - --enable-gateway-api
