{{- $solver := .Values.letsencrypt.solver | default dict -}}
{{- $solverType := default "ingress" $solver.type -}}
{{- $solverIngress := $solver.ingress | default dict -}}
{{- $solverGateway := $solver.gateway | default dict -}}
{{- $ingressClass := default .Values.letsencrypt.ingressClassName $solverIngress.ingressClassName -}}
{{- if eq .Values.environment "production" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: {{ .Values.letsencrypt.production }}
    email: {{ .Values.letsencrypt.email }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          {{- if eq $solverType "gateway" }}
          gatewayHTTPRoute:
            {{- with $solverGateway.parentRefs }}
            parentRefs:
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $solverGateway.labels }}
            labels:
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          ingress:
            ingressClassName: {{ $ingressClass | quote }}
            {{- with $solverIngress.serviceType }}
            serviceType: {{ . | quote }}
            {{- end }}
          {{- end }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: {{ .Values.letsencrypt.staging }}
    email: {{ .Values.letsencrypt.email }}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          {{- if eq $solverType "gateway" }}
          gatewayHTTPRoute:
            {{- with $solverGateway.parentRefs }}
            parentRefs:
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $solverGateway.labels }}
            labels:
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          ingress:
            ingressClassName: {{ $ingressClass | quote }}
            {{- with $solverIngress.serviceType }}
            serviceType: {{ . | quote }}
            {{- end }}
          {{- end }}
