# Default values for platform-nginx-ingress wrapper chart
# These can be overridden via ArgoCD multi-source pattern injecting azure.yaml

# Pass-through values to the ingress-nginx subchart
ingress-nginx:
  controller:
    # Use 2 replicas for high availability
    replicaCount: 2
    
    # Node selector for Linux nodes
    nodeSelector:
      kubernetes.io/os: linux
    
    # Ingress class configuration
    ingressClassResource:
      name: nginx
      enabled: true
      default: true
    
    # Service configuration with Azure-specific annotations
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
      # Azure Load Balancer annotations - values injected via ArgoCD from infra outputs
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
        # service.beta.kubernetes.io/azure-pip-name: ""  # Injected from azure.yaml
        # service.beta.kubernetes.io/azure-load-balancer-resource-group: ""  # Injected from azure.yaml
    
    # Enable metrics for monitoring
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false  # Enable if using Prometheus Operator
    
    # Resource requests/limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    
    # Security context
    allowSnippetAnnotations: false
    
    # Admission webhook patch job node selector
    admissionWebhooks:
      patch:
        nodeSelector:
          kubernetes.io/os: linux
  
  # Default backend configuration
  defaultBackend:
    enabled: true
    nodeSelector:
      kubernetes.io/os: linux
