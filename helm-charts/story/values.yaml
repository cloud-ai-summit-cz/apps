# Default values for story service
# This file provides sensible defaults that can be overridden by environment-specific values

replicaCount: 1

image:
  repository: "" # Override with ACR login server + image name
  pullPolicy: IfNotPresent
  tag: "latest" # Override with commit SHA in env-specific values

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

workloadIdentity:
  enabled: false
  clientId: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8004

httpRoute:
  enabled: false
  parentRefs: []
  hosts:
    - host: ""
      paths:
        - path: /api/stories
          pathType: PathPrefix
          rewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /story

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8004
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8004
  initialDelaySeconds: 10
  periodSeconds: 5

# Environment variables (override in env-specific values)
env:
  AZURE_TENANT_ID: "{{ .Values.auth.tenantId }}"
  APP_ID_URI: "{{ .Values.auth.appIdUri }}"
  COSMOS_ENDPOINT: "{{ .Values.cosmos.endpoint }}"
  COSMOS_DATABASE_NAME: "{{ .Values.cosmos.databaseName }}"
  COSMOS_CONTAINER_NAME: "stories"
  SERVICE_BUS_NAMESPACE: "{{ .Values.serviceBus.namespace }}"
  STORY_JOBS_QUEUE_NAME: "story-jobs"
  AZURE_OPENAI_ENDPOINT: "{{ .Values.openai.endpoint }}"
  AZURE_OPENAI_DEPLOYMENT: "{{ .Values.openai.deployment }}"
  AZURE_OPENAI_API_VERSION: "2024-08-01-preview"
  TRIP_SERVICE_URL: "http://trip-service"
  TOY_SERVICE_URL: "http://toy-service"
  GEO_SERVICE_URL: "http://geo-service"
  API_HOST: "0.0.0.0"
  API_PORT: "8004"
  LOG_LEVEL: "INFO"
  WORKER_MODE: "false"
  MAX_CONCURRENT_MESSAGES: "5"
  AZURE_CLIENT_ID: "{{ .Values.workloadIdentities.story.clientId }}"
  AZURE_TOKEN_CREDENTIALS: "WorkloadIdentityCredential"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.platform-observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "story-service"
  SERVICE_VERSION: "1.0.0"

# Field references for pod metadata
envFieldRef:
  - name: K8S_NAMESPACE
    fieldPath: metadata.namespace
  - name: K8S_POD_NAME
    fieldPath: metadata.name
  - name: K8S_NODE_NAME
    fieldPath: spec.nodeName

# Worker deployment (for queue processing)
worker:
  enabled: false
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    WORKER_MODE: "true"

nodeSelector: {}

tolerations: []

affinity: {}
