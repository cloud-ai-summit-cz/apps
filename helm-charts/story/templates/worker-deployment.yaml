{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "story.fullname" . }}-worker
  labels:
    {{- include "story.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "story.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "story.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- if .Values.workloadIdentities.story }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "story.serviceAccountName" . }}
      containers:
      - name: story-worker
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["python", "workers/story_worker.py"]
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ tpl ($value | toString) $ | quote }}
        {{- end }}
        {{- range $key, $value := .Values.worker.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range .Values.envFieldRef }}
        - name: {{ .name }}
          valueFrom:
            fieldRef:
              fieldPath: {{ .fieldPath }}
        {{- end }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
