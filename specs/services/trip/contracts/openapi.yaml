openapi: 3.0.3
info:
  title: Trip Service API
  version: 0.1.0
  description: |
    Trip & Gallery Service for Stuffed Toy World Tour.

    All endpoints require a Bearer JWT token from Entra ID.

servers:
  - url: /trip
    description: Trip service mounted under `/trip` prefix

paths:
  /:
    post:
      summary: Create trip
      operationId: createTrip
      tags: [Trip]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Validation error
        '403':
          description: Caller does not own toy
        '404':
          description: Toy not found
        '503':
          description: Toy service unavailable or ownership verification failed

    get:
      summary: List trips
      operationId: listTrips
      tags: [Trip]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: toy_id
          schema:
            type: string
            format: uuid
          required: false
          description: Filter by toy ID
        - in: query
          name: owner_oid
          schema:
            type: string
          required: false
          description: Filter by owner object ID
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paged list of trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Missing filter (toy_id or owner_oid required)

  '/{trip_id}':
    get:
      summary: Get trip
      operationId: getTrip
      tags: [Trip]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trip_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip with embedded gallery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip not found

    patch:
      summary: Update trip
      operationId: updateTrip
      tags: [Trip]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trip_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '403':
          description: Caller is not owner
        '404':
          description: Trip not found

    delete:
      summary: Delete trip
      operationId: deleteTrip
      tags: [Trip]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trip_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Trip deleted
        '403':
          description: Caller is not owner
        '404':
          description: Trip not found

  '/{trip_id}/gallery':
    post:
      summary: Upload gallery image
      operationId: uploadGalleryImage
      tags: [Trip Gallery]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trip_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: landmark
          required: false
          schema:
            type: string
            maxLength: 200
        - in: query
          name: caption
          required: false
          schema:
            type: string
            maxLength: 500
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Gallery image (JPEG, PNG, or WebP)
      responses:
        '200':
          description: Trip with updated gallery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid input or file
        '403':
          description: Caller is not owner
        '404':
          description: Trip not found
        '500':
          description: Failed to upload gallery image

  '/{trip_id}/gallery/{image_id}':
    get:
      summary: Download gallery image
      operationId: getGalleryImage
      tags: [Trip Gallery]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trip_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: image_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gallery image stream
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '404':
          description: Trip or image not found
        '500':
          description: Failed to retrieve image

    delete:
      summary: Delete gallery image
      operationId: deleteGalleryImage
      tags: [Trip Gallery]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trip_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: image_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted
        '403':
          description: Caller is not owner
        '404':
          description: Trip or image not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        location_name:
          type: string
        country_code:
          type: string
        toy_id:
          type: string
          format: uuid
        owner_oid:
          type: string
        public_tracking_enabled:
          type: boolean
        status:
          type: string
          enum: [planned, in_progress, completed, cancelled]
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/GalleryImage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - location_name
        - country_code
        - toy_id
        - owner_oid
        - public_tracking_enabled
        - status
        - gallery
        - created_at
        - updated_at

    TripCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        location_name:
          type: string
        country_code:
          type: string
        toy_id:
          type: string
          format: uuid
        public_tracking_enabled:
          type: boolean
      required:
        - title
        - location_name
        - country_code
        - toy_id
        - public_tracking_enabled

    TripUpdate:
      type: object
      description: Partial trip update; all fields optional
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        location_name:
          type: string
        country_code:
          type: string
        public_tracking_enabled:
          type: boolean
        status:
          type: string
          enum: [planned, in_progress, completed, cancelled]

    GalleryImage:
      type: object
      properties:
        image_id:
          type: string
          format: uuid
        landmark:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        blob_name:
          type: string
        source:
          type: string
        uploaded_at:
          type: string
          format: date-time
      required:
        - image_id
        - blob_name
        - source
        - uploaded_at
