# Demo Data Init Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemoeniwvl.azurecr.io/demo-data-init"
  tag: "latest"
replicaCount: 1
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  enabled: false

downstream:
  toyServiceUrl: "https://{{ .Values.ingress.publicIpFqdn }}/api/toys"
  tripServiceUrl: "https://{{ .Values.ingress.publicIpFqdn }}/api/trips"

workloadIdentity:
  enabled: false
  clientId: ""
