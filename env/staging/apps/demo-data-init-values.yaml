# Demo Data Init Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemosedkdx.azurecr.io/demo-data-init"
  tag: "051774e81fe015d6b0cb272feab7f993137aba4c"
replicaCount: 1
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  enabled: true
  type: ClusterIP
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: toytrip-gateway
      namespace: toytrip-staging
      sectionName: https
  # Note: host value comes from azure.yaml via ingress.publicIpFqdn
  hosts:
    - host:
      paths:
        - path: /api/demo-data
          pathType: PathPrefix
          rewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
env:
  TOY_SERVICE_URL: "https://{{ .Values.ingress.publicIpFqdn }}/api/toys"
  TRIP_SERVICE_URL: "https://{{ .Values.ingress.publicIpFqdn }}/api/trips"
workloadIdentity:
  enabled: false
  clientId: ""
