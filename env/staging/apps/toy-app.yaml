apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toy-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Multi-source configuration
  sources:
    # Shared repo reference (chart + env values)
    - repoURL: https://github.com/cloud-ai-summit-cz/apps.git
      targetRevision: main
      ref: repo

    # Helm chart renders using the shared ref
    - ref: repo
      path: helm-charts/toy
      helm:
        valueFiles:
          - $repo/env/staging/infra_config/azure.yaml
          - $repo/env/staging/apps/toy-values.yaml

  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /status
  
  destination:
    server: https://kubernetes.default.svc
    namespace: toytrip-staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
