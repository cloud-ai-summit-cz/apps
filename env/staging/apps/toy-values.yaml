# Toy Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemosedkdx.azurecr.io/toy" # Set by CI: <acr-login-server>/toy-service
  tag: "0de16cb81a971c87949d3db1b41a9c5c17ef9269" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: toytrip-gateway
      namespace: toytrip-staging
      sectionName: https
  hosts:
    - host: "{{ .Values.ingress.publicIpFqdn }}"
      paths:
        - path: /api/toys
          pathType: PathPrefix
          rewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
env:
  # Auth and infrastructure values come from azure-values.yaml
  COSMOS_CONTAINER_NAME: "toys"
  BLOB_CONTAINER_AVATARS: "avatars"
  API_HOST: "0.0.0.0"
  API_PORT: "8001"
  LOG_LEVEL: "INFO"
workloadIdentity:
  enabled: true
  clientId: "6ab480ab-2418-4df3-b2f1-aa481a6a0e9e" # Set when workload identity is configured
