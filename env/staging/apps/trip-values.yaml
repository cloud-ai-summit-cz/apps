# Trip Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemoeniwvl.azurecr.io/trip" # Set by CI: <acr-login-server>/trip-service
  tag: "b51db6e44d73bb602565062b1c1c14ed38dc502b" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: web-frontend-gateway
      namespace: toytrip-staging
      sectionName: https
  hosts:
    - host: "appdemo-eniwvl.swedencentral.cloudapp.azure.com"
      paths:
        - path: /api/trips
          pathType: PathPrefix
env:
  # Auth and infrastructure values come from azure-values.yaml
  COSMOS_CONTAINER_NAME: "trips"
  BLOB_CONTAINER_GALLERY: "gallery"
  TOY_SERVICE_URL: "http://toy-service/api/toys"
  API_HOST: "0.0.0.0"
  API_PORT: "8002"
  LOG_LEVEL: "INFO"
workloadIdentity:
  enabled: false
  clientId: "" # Set when workload identity is configured
