# Trip Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemoeniwvl.azurecr.io/trip" # Set by CI: <acr-login-server>/trip-service
  tag: "b51db6e44d73bb602565062b1c1c14ed38dc502b" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
ingress:
  enabled: true
  hosts:
    - host: "" # Set to actual staging domain
      paths:
        - path: /api/trips
          pathType: Prefix
env:
  AZURE_TENANT_ID: "" # Set from azure.yaml or secret
  APP_ID_URI: "" # Set from App Registration
  COSMOS_ENDPOINT: "" # Set from azure.yaml
  COSMOS_DATABASE_NAME: "toytripdb"
  COSMOS_CONTAINER_NAME: "trips"
  STORAGE_ACCOUNT_URL: "" # Set from azure.yaml
  BLOB_CONTAINER_GALLERY: "gallery"
  TOY_SERVICE_URL: "http://toy-trip/api/toys"
  API_HOST: "0.0.0.0"
  API_PORT: "8002"
  LOG_LEVEL: "INFO"
workloadIdentity:
  enabled: false
  clientId: "" # Set when workload identity is configured
