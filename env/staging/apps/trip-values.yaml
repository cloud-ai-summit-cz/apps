# Trip Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemosedkdx.azurecr.io/trip" # Set by CI: <acr-login-server>/trip-service
  tag: "626f9c85df2765406e4e38a2b898e0f6d2ca1210" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: toytrip-gateway
      namespace: toytrip-staging
      sectionName: https
  # Note: host value comes from azure.yaml via ingress.publicIpFqdn
  hosts:
    - host:
      paths:
        - path: /api/trips
          pathType: PathPrefix
          rewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
env:
  # Auth and infrastructure values come from azure-values.yaml
  COSMOS_CONTAINER_NAME: "trips"
  BLOB_CONTAINER_GALLERY: "gallery"
  TOY_SERVICE_URL: "http://toy-service"
  API_HOST: "0.0.0.0"
  API_PORT: "8002"
  LOG_LEVEL: "INFO"
  # OpenTelemetry Configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.toytrip-staging.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "trip-service"
  SERVICE_VERSION: "0de16cb81a971c87949d3db1b41a9c5c17ef9269"
# Kubernetes Downward API for context
envFieldRef:
  - name: K8S_NAMESPACE
    fieldPath: metadata.namespace
  - name: K8S_POD_NAME
    fieldPath: metadata.name
  - name: K8S_NODE_NAME
    fieldPath: spec.nodeName
workloadIdentity:
  enabled: true
  clientId: "160d13f0-23a1-4a5f-8f6b-a176f93f3a8a" # Set when workload identity is configured
