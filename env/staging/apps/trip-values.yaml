# Trip Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemoeniwvl.azurecr.io/trip" # Set by CI: <acr-login-server>/trip-service
  tag: "07370e8dbba2cfeac22ede89c76a426a09a0f2af" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: toytrip-gateway
      namespace: toytrip-staging
      sectionName: https
  hosts:
    - host: "appdemo-eniwvl.swedencentral.cloudapp.azure.com"
      paths:
        - path: /api/trips
          pathType: PathPrefix
          rewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
env:
  # Auth and infrastructure values come from azure-values.yaml
  COSMOS_CONTAINER_NAME: "trips"
  BLOB_CONTAINER_GALLERY: "gallery"
  TOY_SERVICE_URL: "http://toy-service"
  API_HOST: "0.0.0.0"
  API_PORT: "8002"
  LOG_LEVEL: "INFO"
workloadIdentity:
  enabled: true
  clientId: "160d13f0-23a1-4a5f-8f6b-a176f93f3a8a" # Set when workload identity is configured
