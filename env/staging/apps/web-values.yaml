# Web Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemosedkdx.azurecr.io/web" # Set by CI: <acr-login-server>/web
  tag: "ce2f7456424dc0708db59b8068e0b06e77192af3" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: toytrip-gateway
      namespace: toytrip-staging
      sectionName: https
  # Note: host value comes from azure.yaml via ingress.publicIpFqdn
  hosts:
    - host:
      paths:
        - path: /
          pathType: PathPrefix
# Web service runtime configuration
# These URLs are injected at container startup via docker-entrypoint.sh
env:
  TOY_SERVICE_URL: "https://{{ .Values.ingress.publicIpFqdn }}/api/toys"
  TRIP_SERVICE_URL: "https://{{ .Values.ingress.publicIpFqdn }}/api/trips"
  DEMO_DATA_API_URL: "https://{{ .Values.ingress.publicIpFqdn }}/api/demo-data"
  MSAL_REDIRECT_URI: "https://{{ .Values.ingress.publicIpFqdn }}"
  OTEL_COLLECTOR_URL: "http://otel-collector.toytrip-staging.svc.cluster.local:4318"
  ENVIRONMENT: "staging"
  SERVICE_VERSION: "{{ .Values.image.tag }}"
