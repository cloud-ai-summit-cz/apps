# Web Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemoeniwvl.azurecr.io/web" # Set by CI: <acr-login-server>/web
  tag: "b51db6e44d73bb602565062b1c1c14ed38dc502b" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: toytrip-gateway
      namespace: toytrip-staging
      sectionName: https
  hosts:
    - host: "appdemo-eniwvl.swedencentral.cloudapp.azure.com"
      paths:
        - path: /
          pathType: PathPrefix
# Web service runtime configuration
# These URLs are injected at container startup via docker-entrypoint.sh
env:
  TOY_SERVICE_URL: "http://135.116.244.172/api/toys"
  TRIP_SERVICE_URL: "http://135.116.244.172/api/trips"
