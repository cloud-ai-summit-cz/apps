# Web Service - Staging Environment Values
# This file is automatically updated by CI/CD pipeline with image tags

image:
  repository: "crappdemoeniwvl.azurecr.io/web" # Set by CI: <acr-login-server>/web
  tag: "b51db6e44d73bb602565062b1c1c14ed38dc502b" # Set by CI: commit SHA
replicaCount: 2
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
ingress:
  enabled: true
  hosts:
    - host: "" # Set to actual staging domain
      paths:
        - path: /
          pathType: Prefix
# Web service runtime configuration
# Backend service URLs are set via ingress.ipAddress from azure-values.yaml
# These URLs are injected at container startup via docker-entrypoint.sh
env:
  # TOY_SERVICE_URL and TRIP_SERVICE_URL come from azure-values.yaml via helm template
