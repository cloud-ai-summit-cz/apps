apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toytrip-staging-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/cloud-ai-summit-cz/apps.git
    targetRevision: main
    path: env/staging/platform
    directory:
      recurse: false
      include: '*-app.yaml'
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
