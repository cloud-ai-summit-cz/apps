# Platform Observability - Staging Environment Values
# Enables Aspire Dashboard external access via HTTPRoute

aspireDashboard:
  # Serve dashboard under /aspire path - tells app to generate links with /aspire prefix
  pathBase: /aspire
  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: toytrip-gateway
        namespace: toytrip-staging
        sectionName: https
    hosts:
      - host:
        paths:
          - path: /aspire
            pathType: PathPrefix
            rewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: /
