apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nginx-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  sources:
    # Infrastructure config repository reference for value injection
    - repoURL: https://github.com/cloud-ai-summit-cz/apps.git
      targetRevision: main
      ref: infraconfig
    
    # Helm chart wrapper for nginx-ingress controller
    - repoURL: https://github.com/cloud-ai-summit-cz/apps.git
      targetRevision: main
      path: helm-charts/platform-nginx-ingress
      helm:
        valueFiles:
          - $infraconfig/env/staging/infra_config/azure.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
