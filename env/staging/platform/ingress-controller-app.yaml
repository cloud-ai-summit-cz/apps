apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nginx-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  sources:
    # Infrastructure config repository reference for value injection
    - repoURL: https://github.com/cloud-ai-summit-cz/apps.git
      targetRevision: main
      ref: infraconfig
    
    # Official NGINX Ingress Controller Helm chart
    - repoURL: https://kubernetes.github.io/ingress-nginx
      targetRevision: 4.14.0
      chart: ingress-nginx
      helm:
        values: |
          controller:
            replicaCount: 2
            nodeSelector:
              kubernetes.io/os: linux
            ingressClassResource:
              name: nginx
              enabled: true
              default: true
            service:
              type: LoadBalancer
              externalTrafficPolicy: Local
            metrics:
              enabled: true
              serviceMonitor:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            allowSnippetAnnotations: false
            admissionWebhooks:
              patch:
                nodeSelector:
                  kubernetes.io/os: linux
                tolerations:
                  - key: CriticalAddonsOnly
                    operator: Exists
                    effect: NoSchedule
          defaultBackend:
            enabled: true
            nodeSelector:
              kubernetes.io/os: linux
        valueFiles:
          - $infraconfig/env/staging/infra_config/azure.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
