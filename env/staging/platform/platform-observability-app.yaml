apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/cloud-ai-summit-cz/apps.git
      targetRevision: main
      ref: repo
    - repoURL: https://github.com/cloud-ai-summit-cz/apps.git
      targetRevision: main
      path: helm-charts/platform-observability
      helm:
        valueFiles:
          - values.yaml
          - $repo/env/staging/infra_config/azure.yaml
          - $repo/env/staging/platform/platform-observability-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: toytrip-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
