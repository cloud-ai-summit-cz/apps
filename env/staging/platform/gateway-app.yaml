apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/cloud-ai-summit-cz/apps.git
      targetRevision: main
      ref: repo
    - ref: repo
      path: helm-charts/platform-gateway
      helm:
        valueFiles:
          - $repo/env/staging/infra_config/azure.yaml
          - $repo/env/staging/platform/gateway-values.yaml

  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jsonPointers:
        - /status
    - group: cilium.io
      kind: CiliumIdentity
      jqPathExpressions:
        - .
  destination:
    server: https://kubernetes.default.svc
    namespace: toytrip-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
