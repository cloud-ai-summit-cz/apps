gateway:
  enabled: true
  name: web-frontend-gateway
  annotations: {}
  infrastructure:
    annotations: {}
  listeners:
    - name: http
      hostname: "appdemo-eniwvl.swedencentral.cloudapp.azure.com"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        selector:
          matchLabels:
            acme.cert-manager.io/http01-solver: "true"
    - name: https
      hostname: "appdemo-eniwvl.swedencentral.cloudapp.azure.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        secretName: toytrip-tls
      allowedRoutes:
        namespaces:
          from: Same
certificate:
  enabled: true
  clusterIssuer: letsencrypt-staging
  secretName: toytrip-tls
  dnsNames:
    - "appdemo-eniwvl.swedencentral.cloudapp.azure.com"
