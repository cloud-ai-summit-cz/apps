openapi: 3.0.3
info:
  title: Story Service API
  version: 0.1.0
  description: |
    Story Composer (Batch AI) service for generating daily narrative/story recap 
    using legs, gallery, add-ons, and personality tags.
    
    **Status:** Planned - Not yet implemented
    
    **Authentication:** All endpoints require Bearer JWT token from Entra ID.
    
    **Authorization:**
    - Read story: Global (any authenticated user/system)
    - Refresh story: User/system (rate limited)
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: https://api.toytripplatform.com/v1
    description: Production
  - url: https://api-dev.toytripplatform.com/v1
    description: Development
  - url: http://localhost:8004
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Story
    description: AI-generated trip stories

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Story:
      type: object
      description: Story entity (schema to be defined)
      
    StoryRefresh:
      type: object
      description: Story refresh response (schema to be defined)

paths:
  /story/{trip_id}/latest:
    get:
      tags:
        - Story
      summary: Get latest daily story
      description: |
        Retrieve the latest daily story recap for a trip.
        
        **Status:** Planned
      operationId: getLatestStory
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /story/{trip_id}/refresh:
    post:
      tags:
        - Story
      summary: Request story refresh
      description: |
        Request a story refresh. System may batch compose.
        
        **Status:** Planned
        **Note:** Rate limited
      operationId: refreshStory
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Refresh request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryRefresh'
        '401':
          description: Unauthorized
        '429':
          description: Too many requests
