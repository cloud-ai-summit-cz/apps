openapi: 3.0.3
info:
  title: Agent Service API
  version: 0.1.0
  description: |
    AI Agent Service (Chat Backend via MCP) for in-app chat orchestration.
    Uses MCP protocol tools to call other services (toy, trip, addon, story, geo) 
    and compose responses.
    
    **Status:** Planned - Not yet implemented
    
    **Authentication:** All endpoints require Bearer JWT token from Entra ID.
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: https://api.toytripplatform.com/v1
    description: Production
  - url: https://api-dev.toytripplatform.com/v1
    description: Development
  - url: http://localhost:8005
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Agent
    description: Chat orchestration

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatMessage:
      type: object
      description: Chat message (schema to be defined)
      
    ChatResponse:
      type: object
      description: Chat response (schema to be defined)

paths:
  /agent/chat:
    post:
      tags:
        - Agent
      summary: Send chat message
      description: |
        Send a chat message and receive AI-generated response.
        Agent orchestrates calls to other services via MCP protocol.
        
        **Status:** Planned
      operationId: sendChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: Unauthorized
