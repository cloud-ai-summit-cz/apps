openapi: 3.0.3
info:
  title: Trip Service API
  version: 0.1.0
  description: |
    Trip & Gallery Service for creating trips, managing legs & statuses, storing gallery images per leg.
    
    **Status:** Planned - Not yet implemented
    
    **Authentication:** All endpoints require Bearer JWT token from Entra ID.
    
    **Authorization:**
    - Create trip: User must own toy
    - Read operations: Global (any authenticated user/system)
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: https://api.toytripplatform.com/v1
    description: Production
  - url: https://api-dev.toytripplatform.com/v1
    description: Development
  - url: http://localhost:8001
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Trip
    description: Trip creation and tracking

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Trip:
      type: object
      description: Trip entity (schema to be defined)
      
    TripCreate:
      type: object
      description: Trip creation request (schema to be defined)
      
    TripDetail:
      type: object
      description: Trip detail including legs (schema to be defined)
      
    Gallery:
      type: object
      description: Gallery listing (schema to be defined)

paths:
  /trip:
    post:
      tags:
        - Trip
      summary: Create trip for toy
      description: |
        Create a new trip for a toy. User must own the toy.
        
        **Status:** Planned
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /trip/{trip_id}:
    get:
      tags:
        - Trip
      summary: Get trip detail including legs
      description: |
        Retrieve trip details with all legs.
        
        **Status:** Planned
      operationId: getTrip
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /trip/{trip_id}/gallery:
    get:
      tags:
        - Trip
      summary: Get trip gallery listing
      description: |
        Retrieve gallery images for a trip.
        
        **Status:** Planned
      operationId: getTripGallery
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gallery listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '401':
          description: Unauthorized
        '404':
          description: Not found
