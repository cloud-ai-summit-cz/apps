openapi: 3.0.3
info:
  title: Add-On Service API
  version: 0.1.0
  description: |
    Add-On Services for handling ordering & fulfillment of accessories (hat, outfit, souvenir prop) 
    and experiences (dinner, beer festival, boat rental, coffee & pancake stop).
    
    **Status:** Planned - Not yet implemented
    
    **Authentication:** All endpoints require Bearer JWT token from Entra ID.
    
    **Authorization:**
    - Order add-on: User must own toy
    - View order: Owner or system
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: https://api.toytripplatform.com/v1
    description: Production
  - url: https://api-dev.toytripplatform.com/v1
    description: Development
  - url: http://localhost:8002
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Add-On
    description: Accessory and experience orders

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AddOnOrder:
      type: object
      description: Add-on order entity (schema to be defined)
      
    AddOnOrderCreate:
      type: object
      description: Add-on order creation request (schema to be defined)
      
    AddOnOrderStatus:
      type: object
      description: Add-on order status (schema to be defined)

paths:
  /addon/order:
    post:
      tags:
        - Add-On
      summary: Order accessory or experience
      description: |
        Order an accessory or experience for a toy. User must own the toy.
        
        Categories:
        - Accessories: hat, outfit, souvenir prop
        - Experiences: dinner, beer at festival, boat rental, coffee & pancake stop
        
        **Status:** Planned
      operationId: createAddOnOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOnOrderCreate'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOnOrder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /addon/{order_id}:
    get:
      tags:
        - Add-On
      summary: Get order status
      description: |
        Retrieve order status. Owner or system can access.
        
        **Status:** Planned
      operationId: getAddOnOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOnOrderStatus'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
