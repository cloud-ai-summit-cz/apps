# Shared OpenAPI Components
# Common schemas, security schemes, parameters, and responses used across all microservices

openapi: 3.0.3
info:
  title: Shared Components
  version: 1.0.0
  description: Common components for Toy Trip Platform API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Entra ID JWT token with:
        - Issuer: `https://login.microsoftonline.com/{tenant_id}/v2.0`
        - Audience: Application ID URI (e.g., `api://<app_id>`)
        - Scope: `App.Access` or Role: `System.Service`

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - VALIDATION_ERROR
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
              description: Error code
            message:
              type: string
              description: Human-readable error message
            correlation_id:
              type: string
              format: uuid
              description: Request correlation ID for tracing
            details:
              type: array
              items:
                type: object
              description: Additional error details
      example:
        error:
          code: "NOT_FOUND"
          message: "Resource not found"
          correlation_id: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Missing or invalid authentication token"

    Forbidden:
      description: Authenticated but insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "FORBIDDEN"
              message: "Insufficient permissions to access this resource"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "NOT_FOUND"
              message: "Resource not found"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - field: "name"
                  message: "Name is required"

    Conflict:
      description: Operation conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "CONFLICT"
              message: "Resource already exists"

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional client-provided trace identifier
      example: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"

    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page
      example: 20

    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Starting position in the result set
      example: 0
