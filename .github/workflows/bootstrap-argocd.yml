name: Bootstrap ArgoCD on AKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to bootstrap (staging/production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap-argocd:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load infrastructure config
        id: load-config
        run: |
          if [ ! -f "env/${{ inputs.environment }}/infra_config/azure.yaml" ]; then
            echo "Error: azure.yaml not found for ${{ inputs.environment }}"
            exit 1
          fi
          
          AKS_NAME=$(yq '.aks.name' env/${{ inputs.environment }}/infra_config/azure.yaml)
          RESOURCE_GROUP=$(yq '.resourceGroup' env/${{ inputs.environment }}/infra_config/azure.yaml)
          
          echo "AKS_NAME=$AKS_NAME" >> $GITHUB_OUTPUT
          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          
          echo "Loaded config: RG=$RESOURCE_GROUP, AKS=$AKS_NAME"

      - name: Verify AKS cluster exists
        run: |
          az aks show \
            --resource-group ${{ steps.load-config.outputs.RESOURCE_GROUP }} \
            --name ${{ steps.load-config.outputs.AKS_NAME }} \
            --query "provisioningState" -o tsv

      - name: Install ArgoCD namespace and manifests
        run: |
          echo "Installing ArgoCD in namespace 'argocd'..."
          az aks command invoke \
            --resource-group ${{ steps.load-config.outputs.RESOURCE_GROUP }} \
            --name ${{ steps.load-config.outputs.AKS_NAME }} \
            --command "kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f - && \
                       kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"

      - name: Wait for ArgoCD to be ready
        run: |
          echo "Waiting for ArgoCD server to be ready..."
          az aks command invoke \
            --resource-group ${{ steps.load-config.outputs.RESOURCE_GROUP }} \
            --name ${{ steps.load-config.outputs.AKS_NAME }} \
            --command "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s"

      - name: Configure ArgoCD repository access
        env:
          GH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          echo "Configuring private repository access for ArgoCD..."
          
          # Create repo secret manifest
          cat <<EOF > /tmp/repo-secret.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: repo-apps
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: git
            url: https://github.com/${{ github.repository }}.git
            username: git
            password: ${GH_TOKEN}
          EOF
          
          # Apply the secret using run command with file attachment
          az aks command invoke \
            --resource-group ${{ steps.load-config.outputs.RESOURCE_GROUP }} \
            --name ${{ steps.load-config.outputs.AKS_NAME }} \
            --file /tmp/repo-secret.yaml \
            --command "kubectl apply -f repo-secret.yaml"
          
          rm -f /tmp/repo-secret.yaml

      - name: Apply ArgoCD root application (app of apps)
        run: |
          echo "Applying root application for ${{ inputs.environment }}..."
          
          # Copy root app manifest to temp location
          cp env/${{ inputs.environment }}/bootstrap/root-app.yaml /tmp/root-app.yaml
          
          # Apply using run command
          az aks command invoke \
            --resource-group ${{ steps.load-config.outputs.RESOURCE_GROUP }} \
            --name ${{ steps.load-config.outputs.AKS_NAME }} \
            --file /tmp/root-app.yaml \
            --command "kubectl apply -f root-app.yaml"
          
          rm -f /tmp/root-app.yaml
