name: Build and Push Trip Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/services/trip/**'
      - 'src/shared/**'
      - '.github/workflows/build-trip.yml'

env:
  SERVICE_NAME: trip

jobs:
  build-and-push:
    name: Build and Push Trip Service
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Load ACR Name from Config
        id: config
        run: |
          ACR_NAME=$(yq '.acr.name' env/staging/infra_config/azure.yaml)
          ACR_LOGIN_SERVER=$(yq '.acr.loginServer' env/staging/infra_config/azure.yaml)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "Loaded ACR: $ACR_NAME ($ACR_LOGIN_SERVER)"
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.config.outputs.acr_name }}
      
      - name: Build and Push to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/services/${{ env.SERVICE_NAME }}/Dockerfile
          push: true
          tags: |
            ${{ steps.config.outputs.acr_login_server }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ steps.config.outputs.acr_login_server }}/${{ env.SERVICE_NAME }}:latest
