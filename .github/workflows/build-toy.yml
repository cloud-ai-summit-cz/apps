name: Build and Push Toy Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/services/toy/**'
      - 'src/shared/**'
      - '.github/workflows/build-toy.yml'

env:
  SERVICE_NAME: toy

jobs:
  build-and-push:
    name: Build and Push Toy Service
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Load ACR Name from Config
        id: config
        run: |
          ACR_NAME=$(yq '.acr.name' env/staging/infra_config/azure.yaml)
          ACR_LOGIN_SERVER=$(yq '.acr.loginServer' env/staging/infra_config/azure.yaml)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "Loaded ACR: $ACR_NAME ($ACR_LOGIN_SERVER)"
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.config.outputs.acr_name }}
      
      - name: Build and Push to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/services/${{ env.SERVICE_NAME }}/Dockerfile
          push: true
          tags: |
            ${{ steps.config.outputs.acr_login_server }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ steps.config.outputs.acr_login_server }}/${{ env.SERVICE_NAME }}:latest
      
      - name: Update Staging Values File
        run: |
          VALUES_FILE="env/staging/apps/${{ env.SERVICE_NAME }}-values.yaml"
          yq -i '.image.repository = "${{ steps.config.outputs.acr_login_server }}/${{ env.SERVICE_NAME }}"' $VALUES_FILE
          yq -i '.image.tag = "${{ github.sha }}"' $VALUES_FILE
          echo "Updated $VALUES_FILE with new image tag"
      
      - name: Commit Updated Values File
        uses: EndBug/add-and-commit@v9
        with:
          add: 'env/staging/apps/${{ env.SERVICE_NAME }}-values.yaml'
          message: 'Automation - Update ${{ env.SERVICE_NAME }} image to ${{ github.sha }}'
          default_author: github_actions
          pull: '--rebase --autostash'
