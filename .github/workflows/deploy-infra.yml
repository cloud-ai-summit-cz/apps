name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  id-token: write   # for OIDC federated auth
  contents: write   # to commit azure.yaml updates

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      LOCATION: swedencentral
      BICEP_FILE: infra/bicep/main.bicep
      BICEPPARAM_FILE: infra/bicep/main.parameters.bicepparam
      DEPLOYMENT_NAME: infra-main
    outputs:
      aks-cluster-name: ${{ steps.deployment.outputs.aksClusterName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }} --tags managed-by=github-actions || true

      - name: Deploy Bicep
        id: deployment
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          name: ${{ env.DEPLOYMENT_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template-file: ${{ env.BICEP_FILE }}
          parameters-file: ${{ env.BICEPPARAM_FILE }}
          parameters: '{"userObjectId": "${{ secrets.AZURE_DEVELOPER_OBJECT_ID || '' }}", "gitHubWorkflowIdentityObjectId": "${{ secrets.AZURE_OBJECT_ID || '' }}"}'

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Generate azure.yaml using yq
        run: |
          mkdir -p env/staging/infra_config
          yq -n '.resourceGroup = strenv(RESOURCE_GROUP)' | \
          yq '.acr.name = strenv(ACR_NAME)' | \
          yq '.acr.loginServer = strenv(ACR_LOGIN_SERVER)' | \
          yq '.aks.name = strenv(AKS_CLUSTER_NAME)' | \
          yq '.aks.oidcIssuerUrl = strenv(AKS_OIDC_ISSUER_URL)' | \
          yq '.storage.accountId = strenv(STORAGE_ACCOUNT_ID)' | \
          yq '.storage.accountName = strenv(STORAGE_ACCOUNT_NAME)' | \
          yq '.storage.accountUrl = strenv(STORAGE_ACCOUNT_URL)' | \
          yq '.cosmos.accountId = strenv(COSMOS_ACCOUNT_ID)' | \
          yq '.cosmos.accountName = strenv(COSMOS_ACCOUNT_NAME)' | \
          yq '.cosmos.endpoint = strenv(COSMOS_ENDPOINT)' | \
          yq '.cosmos.databaseName = "toytripdb"' | \
          yq '.auth.tenantId = strenv(AZURE_TENANT_ID)' | \
          yq '.auth.appIdUri = strenv(APP_ID_URI)' | \
          yq '.ingress.publicIpName = strenv(INGRESS_PUBLIC_IP_NAME)' | \
          yq '.ingress.publicIpAddress = strenv(INGRESS_PUBLIC_IP_ADDRESS)' | \
          yq '.ingress.publicIpFqdn = strenv(INGRESS_PUBLIC_IP_FQDN)' | \
          yq '.ingress.resourceGroup = strenv(INGRESS_RESOURCE_GROUP)' | \
          yq '.letsencrypt.email = strenv(LETSENCRYPT_EMAIL)' | \
          yq '.letsencrypt.solver.type = "gateway"' | \
          yq '.letsencrypt.solver.gateway.parentRefs = [{"name": strenv(GATEWAY_NAME), "namespace": strenv(GATEWAY_NAMESPACE), "sectionName": "http"}]' | \
          yq '.letsencrypt.solver.gateway.labels."acme.cert-manager.io/http01-solver" = "true"' | \
          yq '.otelCollector.azureMonitor.connectionString = strenv(APP_INSIGHTS_CONN_STRING)' | \
          yq '.generatedAt = strenv(TIMESTAMP)' > env/staging/infra_config/azure.yaml
        env:
          ACR_NAME: ${{ steps.deployment.outputs.acrName }}
          ACR_LOGIN_SERVER: ${{ steps.deployment.outputs.acrLoginServer }}
          AKS_CLUSTER_NAME: ${{ steps.deployment.outputs.aksClusterName }}
          AKS_OIDC_ISSUER_URL: ${{ steps.deployment.outputs.aksOidcIssuerUrl }}
          STORAGE_ACCOUNT_ID: ${{ steps.deployment.outputs.storageAccountId }}
          STORAGE_ACCOUNT_NAME: ${{ steps.deployment.outputs.storageAccountName }}
          STORAGE_ACCOUNT_URL: https://${{ steps.deployment.outputs.storageAccountName }}.blob.core.windows.net/
          COSMOS_ACCOUNT_ID: ${{ steps.deployment.outputs.cosmosAccountId }}
          COSMOS_ACCOUNT_NAME: ${{ steps.deployment.outputs.cosmosAccountName }}
          COSMOS_ENDPOINT: https://${{ steps.deployment.outputs.cosmosAccountName }}.documents.azure.com:443/
          APP_INSIGHTS_CONN_STRING: ${{ steps.deployment.outputs.applicationInsightsConnectionString }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APP_ID_URI: ${{ secrets.APP_ID_URI }}
          INGRESS_PUBLIC_IP_NAME: ${{ steps.deployment.outputs.ingressPublicIpName }}
          INGRESS_PUBLIC_IP_ADDRESS: ${{ steps.deployment.outputs.ingressPublicIpAddress }}
          INGRESS_PUBLIC_IP_FQDN: ${{ steps.deployment.outputs.ingressPublicIpFqdn }}
          INGRESS_RESOURCE_GROUP: ${{ steps.deployment.outputs.ingressPublicIpResourceGroup }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETS_ENCRYPT_EMAIL }}
          GATEWAY_NAME: toytrip-gateway
          GATEWAY_NAMESPACE: toytrip-staging
          TIMESTAMP: ${{ steps.timestamp.outputs.value }}

      - name: Inject workload identities into azure.yaml
        if: ${{ steps.deployment.outputs.workloadIdentities != '' }}
        env:
          WORKLOAD_IDENTITIES: ${{ steps.deployment.outputs.workloadIdentities }}
        run: |
          set -euo pipefail
          identities=$(echo "$WORKLOAD_IDENTITIES" | jq -c '.[]')
          if [ -z "$identities" ]; then
            echo "No workload identities returned"
            exit 0
          fi

          while IFS= read -r item; do
            _jq() { echo "$item" | jq -r "$1"; }
            name=$(_jq '.name')
            resourceId=$(_jq '.resourceId')
            clientId=$(_jq '.clientId')
            principalId=$(_jq '.principalId')
            saNamespace=$(_jq '.serviceAccountNamespace')
            saName=$(_jq '.serviceAccountName')
            federatedSubject=$(_jq '.federatedSubject')

            yq -i ".workloadIdentities.\"${name}\".resourceId = \"${resourceId}\"" env/staging/infra_config/azure.yaml
            yq -i ".workloadIdentities.\"${name}\".clientId = \"${clientId}\"" env/staging/infra_config/azure.yaml
            yq -i ".workloadIdentities.\"${name}\".principalId = \"${principalId}\"" env/staging/infra_config/azure.yaml
            yq -i ".workloadIdentities.\"${name}\".serviceAccountNamespace = \"${saNamespace}\"" env/staging/infra_config/azure.yaml
            yq -i ".workloadIdentities.\"${name}\".serviceAccountName = \"${saName}\"" env/staging/infra_config/azure.yaml
            yq -i ".workloadIdentities.\"${name}\".federatedSubject = \"${federatedSubject}\"" env/staging/infra_config/azure.yaml

            if [ "$name" == "otelcollector" ]; then
               yq -i ".otelCollector.azureMonitor.clientId = \"${clientId}\"" env/staging/infra_config/azure.yaml
            fi
          done <<< "$identities"

      - name: Update service workload identity values
        if: ${{ steps.deployment.outputs.workloadIdentities != '' }}
        env:
          WORKLOAD_IDENTITIES: ${{ steps.deployment.outputs.workloadIdentities }}
        run: |
          set -euo pipefail
          identities=$(echo "$WORKLOAD_IDENTITIES" | jq -c '.[]')
          if [ -z "$identities" ]; then
            echo "No workload identities returned"
            exit 0
          fi

          while IFS= read -r item; do
            _jq() { echo "$item" | jq -r "$1"; }
            name=$(_jq '.name')
            clientId=$(_jq '.clientId')

            case "$name" in
              toy)
                file="env/staging/apps/toy-values.yaml"
                ;;
              trip)
                file="env/staging/apps/trip-values.yaml"
                ;;
              *)
                echo "Skipping unknown workload identity: $name"
                continue
                ;;
            esac

            yq -i '.workloadIdentity.enabled = true' "$file"
            yq -i ".workloadIdentity.clientId = \"${clientId}\"" "$file"
          done <<< "$identities"

      - name: Commit azure.yaml if changed
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            env/staging/infra_config/azure.yaml
            env/staging/apps/toy-values.yaml
            env/staging/apps/trip-values.yaml
          message: 'Automation - Infrastructure config'
          default_author: github_actions

  bootstrap-argocd:
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install ArgoCD via Helm
        run: |
          az aks command invoke \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ needs.deploy-infrastructure.outputs.aks-cluster-name }} \
            --file infra/argocd-values.yaml \
            --command "kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f - && \
                       helm repo add argo https://argoproj.github.io/argo-helm && \
                       helm repo update && \
                       helm upgrade --install argocd argo/argo-cd \
                         --namespace argocd \
                         --version 9.1.3 \
                         --values argocd-values.yaml \
                         --wait \
                         --timeout 10m"

      - name: Configure ArgoCD repository access
        env:
          GH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          az aks command invoke \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ needs.deploy-infrastructure.outputs.aks-cluster-name }} \
            --command "kubectl create secret generic repo-apps \
              --namespace argocd \
              --from-literal=type=git \
              --from-literal=url=https://github.com/${{ github.repository }}.git \
              --from-literal=username=git \
              --from-literal=password='${GH_TOKEN}' \
              --dry-run=client -o yaml | kubectl apply -f - && \
              kubectl label secret repo-apps -n argocd argocd.argoproj.io/secret-type=repository --overwrite"

      - name: Apply ArgoCD platform application (app of apps for platform)
        run: |
          az aks command invoke \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ needs.deploy-infrastructure.outputs.aks-cluster-name }} \
            --file env/staging/bootstrap/platform-root.yaml \
            --command "kubectl apply -f platform-root.yaml"

      - name: Apply ArgoCD root application (app of apps for services)
        run: |
          az aks command invoke \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ needs.deploy-infrastructure.outputs.aks-cluster-name }} \
            --file env/staging/bootstrap/app-root.yaml \
            --command "kubectl apply -f app-root.yaml"