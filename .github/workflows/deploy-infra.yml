name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  id-token: write   # for OIDC federated auth
  contents: write   # to commit azure.yaml updates

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: rg-appdemo
      LOCATION: swedencentral
      BICEP_FILE: infra/bicep/main.bicep
      BICEPPARAM_FILE: infra/bicep/main.parameters.bicepparam
      DEPLOYMENT_NAME: infra-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }} --tags managed-by=github-actions || true

      - name: Deploy Bicep
        id: deployment
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          name: ${{ env.DEPLOYMENT_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template-file: ${{ env.BICEP_FILE }}
          parameters-file: ${{ env.BICEPPARAM_FILE }}
          parameters: userObjectId=${{ secrets.AZURE_DEVELOPER_OBJECT_ID || '' }} gitHubWorkflowIdentityObjectId=${{ secrets.AZURE_OBJECT_ID || '' }}

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Generate azure.yaml using yq
        run: |
          mkdir -p env/staging/infra_config
          yq -n '.resourceGroup = strenv(RESOURCE_GROUP)' | \
          yq '.acr.name = strenv(ACR_NAME)' | \
          yq '.acr.loginServer = strenv(ACR_LOGIN_SERVER)' | \
          yq '.aks.name = strenv(AKS_CLUSTER_NAME)' | \
          yq '.aks.oidcIssuerUrl = strenv(AKS_OIDC_ISSUER_URL)' | \
          yq '.storage.accountId = strenv(STORAGE_ACCOUNT_ID)' | \
          yq '.storage.accountName = strenv(STORAGE_ACCOUNT_NAME)' | \
          yq '.cosmos.accountId = strenv(COSMOS_ACCOUNT_ID)' | \
          yq '.cosmos.accountName = strenv(COSMOS_ACCOUNT_NAME)' | \
          yq '.generatedAt = strenv(TIMESTAMP)' > env/staging/infra_config/azure.yaml
        env:
          ACR_NAME: ${{ steps.deployment.outputs.acrName }}
          ACR_LOGIN_SERVER: ${{ steps.deployment.outputs.acrLoginServer }}
          AKS_CLUSTER_NAME: ${{ steps.deployment.outputs.aksClusterName }}
          AKS_OIDC_ISSUER_URL: ${{ steps.deployment.outputs.aksOidcIssuerUrl }}
          STORAGE_ACCOUNT_ID: ${{ steps.deployment.outputs.storageAccountId }}
          STORAGE_ACCOUNT_NAME: ${{ steps.deployment.outputs.storageAccountName }}
          COSMOS_ACCOUNT_ID: ${{ steps.deployment.outputs.cosmosAccountId }}
          COSMOS_ACCOUNT_NAME: ${{ steps.deployment.outputs.cosmosAccountName }}
          TIMESTAMP: ${{ steps.timestamp.outputs.value }}

      - name: Commit azure.yaml if changed
        uses: EndBug/add-and-commit@v9
        with:
          add: 'env/staging/infra_config/azure.yaml'
          message: 'Automation - Infrastructure config'
          default_author: github_actions

      - name: Install ArgoCD namespace and manifests
        run: |
          echo "Installing ArgoCD in namespace 'argocd'..."
          
          # Retry logic for az aks command invoke (handles node autoprovisioning delays)
          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=60
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            if az aks command invoke \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ steps.deployment.outputs.aksClusterName }} \
              --command "kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f - && \
                         kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"; then
              echo "ArgoCD installation successful!"
              break
            else
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "Failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
              echo "Command failed, waiting ${DELAY}s before retry (node may be provisioning)..."
              sleep $DELAY
              DELAY=$((DELAY * 2))  # Exponential backoff
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: Wait for ArgoCD to be ready
        run: |
          echo "Waiting for ArgoCD server to be ready..."
          
          # Retry logic for az aks command invoke
          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=60
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            if az aks command invoke \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ steps.deployment.outputs.aksClusterName }} \
              --command "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s"; then
              echo "ArgoCD is ready!"
              break
            else
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "Failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
              echo "Command failed, waiting ${DELAY}s before retry..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: Configure ArgoCD repository access
        env:
          GH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          echo "Configuring private repository access for ArgoCD..."
          
          # Create repo secret manifest
          cat <<EOF > /tmp/repo-secret.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: repo-apps
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: git
            url: https://github.com/${{ github.repository }}.git
            username: git
            password: ${GH_TOKEN}
          EOF
          
          # Retry logic for az aks command invoke
          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=60
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            if az aks command invoke \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ steps.deployment.outputs.aksClusterName }} \
              --file /tmp/repo-secret.yaml \
              --command "kubectl apply -f repo-secret.yaml"; then
              echo "Repository secret configured successfully!"
              rm -f /tmp/repo-secret.yaml
              break
            else
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "Failed after $MAX_ATTEMPTS attempts"
                rm -f /tmp/repo-secret.yaml
                exit 1
              fi
              echo "Command failed, waiting ${DELAY}s before retry..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: Apply ArgoCD root application (app of apps)
        run: |
          echo "Applying root application for staging..."
          
          # Copy root app manifest to temp location
          cp env/staging/bootstrap/root-app.yaml /tmp/root-app.yaml
          
          # Retry logic for az aks command invoke
          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=60
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            if az aks command invoke \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ steps.deployment.outputs.aksClusterName }} \
              --file /tmp/root-app.yaml \
              --command "kubectl apply -f root-app.yaml"; then
              echo "Root application applied successfully!"
              rm -f /tmp/root-app.yaml
              break
            else
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "Failed after $MAX_ATTEMPTS attempts"
                rm -f /tmp/root-app.yaml
                exit 1
              fi
              echo "Command failed, waiting ${DELAY}s before retry..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done